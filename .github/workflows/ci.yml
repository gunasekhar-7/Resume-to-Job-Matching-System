name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talentlens
          POSTGRES_USER: talentlens
          POSTGRES_PASSWORD: talentlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentlens -d talentlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "$(grep '^torch==' requirements.lock)"
          python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.lock --strict
      - name: Static security scan
        run: python -m bandit -q -ll -r src api
      - name: Lint
        run: python -m ruff check src api frontend tests scripts migrations
      - name: Compile
        run: python -m compileall -q src api frontend migrations
      - name: Verify database migration
        env:
          TALENTLENS_DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: PostgreSQL migration and storage integration
        env:
          TALENTLENS_DATABASE_URL: postgresql+psycopg2://talentlens:talentlens@127.0.0.1:5432/talentlens
          TALENTLENS_TEST_POSTGRES_URL: postgresql+psycopg2://talentlens:talentlens@127.0.0.1:5432/talentlens
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m pytest tests/test_postgres_storage.py -q
      - name: Unit and API tests
        run: python -m pytest tests -q
      - name: Verify evaluation metrics are reproducible
        run: python -m pytest tests/test_evaluation.py -q

  container-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build container image with locked dependencies
        run: docker build -t talentlens:ci .
      - name: Verify test suite runs cleanly inside container
        run: |
          printf '%s\n' \
            'FROM talentlens:ci' \
            'USER root' \
            'RUN pip install --no-cache-dir "pytest>=8.0"' \
            'COPY tests ./tests' \
            'USER app' \
            | docker build -t talentlens:ci-test -f - .
          docker run --rm -e PYTEST_ADDOPTS="-o cache_dir=/tmp/pytest_cache" talentlens:ci-test python -m pytest tests -q
