name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check src api tests scripts
      - name: Compile
        run: python -m compileall -q src api frontend
      - name: Unit and API tests
        run: python -m pytest tests -q
      - name: Verify evaluation metrics are reproducible
        run: python -m pytest tests/test_evaluation.py -q
