services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentlens
      POSTGRES_USER: talentlens
      POSTGRES_PASSWORD: talentlens-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentlens -d talentlens"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    command:
      - /bin/sh
      - -c
      - python scripts/bootstrap_runtime.py && uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      TALENTLENS_ENV: docker
      TALENTLENS_DATABASE_URL: postgresql+psycopg2://talentlens:talentlens-local-only@db:5432/talentlens
      TALENTLENS_CORS_ORIGINS: http://localhost:8501
      TALENTLENS_API_BASE_URL: http://localhost:8000
      TALENTLENS_RESUME_RETENTION_HOURS: "24"
      TALENTLENS_EMBEDDING_BACKEND: sentence_transformers
      TALENTLENS_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data/processed:/app/data/processed
      - ./data/sample:/app/data/sample:ro
      - ./configs:/app/configs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  frontend:
    build: .
    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      TALENTLENS_API_URL: http://api:8000
      TALENTLENS_FRONTEND_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
