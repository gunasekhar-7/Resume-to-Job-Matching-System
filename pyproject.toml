[project]
name = "talentlens"
version = "1.0.0"
description = "Explainable AI-powered resume-to-job matching and recommendation platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TalentLens" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "spacy>=3.7",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "streamlit>=1.35",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "PyJWT[crypto]>=2.8",
    "slowapi>=0.1.9",
    "psutil>=5.9",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]
ocr = ["pytesseract>=0.3", "Pillow>=10.0"]
privacy = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "model: requires a real embedding/reranker model download (slow)",
    "integration: exercises multiple pipeline stages",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "api", "tests"]
exclude = ["artifacts", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",
    "B008",
    # str+Enum (rather than StrEnum) keeps Python 3.10 compatibility.
    "UP042",
    # datetime.timezone.utc (rather than datetime.UTC) keeps Python 3.10 compatibility.
    "UP017",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
"notebooks/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["artifacts", "notebooks", "tests"]
