# TalentLens skill taxonomy.
#
# Purpose
# -------
# Canonical skill names, categories, aliases and an explicit (conservative)
# related-skill credit map used by the matching engine.
#
# Provenance
# ----------
# This taxonomy was authored for TalentLens, informed by the public skill
# categories described by ESCO (European Skills, Competences, Qualifications
# and Occupations) and O*NET (Occupations and Skills). No ESCO/O*NET data files
# are redistributed here, and neither dataset is bundled. ESCO is published by
# the European Commission; O*NET by the U.S. Department of Labor. Anyone
# redistributing derived data must review those licences/terms separately.
# See docs/DATASET_CARD.md for the full provenance statement.
#
# Design rules
# ------------
# 1. A canonical name must be unambiguous ("Go", "C", "R" are case sensitive).
# 2. Aliases never include generic single letters that would produce false
#    positives in prose.
# 3. `related` credit is partial and conservative. It exists so a genuinely
#    transferable technology is not scored as a total miss, never to inflate a
#    loosely related tool to a full exact match.
# 4. Adding a skill here does not imply proficiency; extraction always records
#    the resume section and evidence span.

