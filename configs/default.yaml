# TalentLens central configuration.
# Every value can be overridden with environment variables (see src/talentlens/config.py).
project:
  name: TalentLens
  version: "1.0.0"
  config_version: "2026-11-04.1"
  description: "Explainable resume-to-job matching and recommendation"

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  annotations_dir: data/annotations
  sample_dir: data/sample
  artifacts_dir: artifacts
  reports_dir: reports
  logs_dir: artifacts/logs

ingestion:
  allowed_extensions: [".pdf", ".docx", ".txt"]
  max_file_size_mb: 10
  max_pages: 20
  min_text_chars: 40
  # Optional OCR fallback for scanned PDFs. Requires pytesseract + Pillow + Tesseract binary.
  ocr_enabled: false
  ocr_min_chars_per_page: 25
  ocr_min_confidence: 60.0

privacy:
  persist_raw_uploads: false
  persist_parsed_text: true
  resume_retention_hours: 24
  # Background expiry sweep; 0 disables the periodic sweep (startup still purges).
  retention_purge_interval_seconds: 3600
  pii_redaction_enabled: true
  redaction_placeholder: "[REDACTED]"
  max_retained_resumes_per_session: 20
  # Optional Presidio + spaCy NER person-name redaction.
  presidio_enabled: false

parsing:
  parser_version: "1.0.0"
  min_section_chars: 12
  max_heading_words: 6
  keep_page_break_markers: false

skills:
  taxonomy_path: configs/skills_taxonomy.yaml
  min_confidence: 0.60
  # Skills found in these sections are considered stronger evidence by consumers
  # (they are never merged; section is always preserved on the mention).
  strong_evidence_sections: ["skills", "experience", "projects"]
  ambiguous_case_sensitive: true

jobs:
  min_description_chars: 60
  max_title_chars: 160
  required_heading_patterns: ["required", "requirements", "must have", "must-have", "minimum qualifications"]
  preferred_heading_patterns: ["preferred", "nice to have", "nice-to-have", "bonus", "desired"]
  default_seniority: null

embeddings:
  backend: sentence_transformers            # sentence_transformers | lsa
  model_name: sentence-transformers/all-MiniLM-L6-v2
  fallback_model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize: true
  device: cpu
  cache_dir: artifacts/embeddings
  cache_enabled: true
  max_seq_length: 256
  # LSA fallback configuration (used only when the transformer backend is unavailable)
  lsa_components: 192
  lsa_min_df: 1
  lsa_max_features: 30000

retrieval:
  top_k: 50
  faiss:
    index_type: flat_ip       # flat_ip (exact) is the default given corpus size
    metric: inner_product
  tfidf:
    ngram_range: [1, 2]
    min_df: 1
    max_df: 0.9
    sublinear_tf: true
    max_features: 50000
  semantic:
    candidate_multiplier: 2

matching:
  # Frozen defaults: validation-only candidates all tied at NDCG@10 1.0000, so the
  # documented default was retained before the held-out test run. See
  # docs/MATCHING_METHODOLOGY.md and reports/phase3_weight_tuning.json.
  weights:
    semantic: 0.30
    section_relevance: 0.15
    required_skills: 0.33
    preferred_skills: 0.07
    experience: 0.15
  related_skill_credit_default: 0.5
  section_weights:
    summary: 0.6
    skills: 1.0
    experience: 1.0
    projects: 0.9
    education: 0.5
    certifications: 0.7
    publications: 0.6
    additional: 0.3
  max_section_evidence: 3
  evidence:
    # Minimum cosine similarity for a resume sentence to be shown as supporting evidence.
    # Below this floor the explanation says no sentence crossed the threshold rather than
    # manufacturing a citation.
    min_similarity: 0.30
    max_items: 3
  max_skills_per_job: 40
  reranker:
    enabled: false
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 30
    batch_size: 16
    max_length: 256
    # Fallback reranker used when the cross-encoder model is unavailable.
    lexical_fallback: true

experience:
  # Used when the job description states no explicit requirement.
  neutral_alignment_score: 0.6
  # Score given when experience information is insufficient in the resume.
  insufficient_information_score: 0.5
  internship_weight: 0.5
  project_weight: 0.0          # projects are preserved separately, not counted as professional experience
  max_plausible_years: 50

evaluation:
  relevance_scale: { not_relevant: 0, partially_relevant: 1, strongly_relevant: 2 }
  binary_relevance_threshold: 2
  k_values: [1, 3, 5, 10]
  primary_k: 10
  splits:
    dev: 0.5
    validation: 0.25
    test: 0.25
  random_seed: 42

api:
  host: 127.0.0.1
  port: 8000
  request_id_header: X-Request-ID
  max_upload_mb: 10
  rate_limit_per_minute: 60
  page_size_default: 20
  page_size_max: 100
  background_processing: true
  # Local HTTP uses false; set true behind TLS in a real deployment.
  cookie_secure: false
  # Service bearer authentication is required when a token is configured.
  # Production startup fails closed unless TALENTLENS_API_TOKEN is set.
  require_auth: false
  session_cookie_name: talentlens_session

monitoring:
  enabled: true
  log_json: false
  expose_prometheus: false
